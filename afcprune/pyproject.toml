[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afcprune"
version = "0.1.0"
description = "AFC-preserving structured pruning: output-layer functional connectivity as a pruning criterion"
requires-python = ">=3.10"
# torch / torchvision: install the wheel matching the GPU driver first (see README)
dependencies = ["numpy", "scipy", "scikit-learn", "ptflops", "matplotlib", "pillow"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["afcprune", "afcprune.scores"]

[tool.pytest.ini_options]
testpaths = ["tests"]
